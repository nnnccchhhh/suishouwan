<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>斗罗人生 · 转盘</title>
<style>
/* =========================================================
   斗罗人生 · 转盘
   一年一转。等级会涨会掉,每十级转一次魂环,猎到稀有魂兽可能爆魂骨,
   转到「机遇」就开一个机遇盘。年份按剧情需要跳。
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#fff;color:#111;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  display:flex;justify-content:center;padding:16px 14px 44px;
  -webkit-font-smoothing:antialiased;
}
.page{width:100%;max-width:660px}

.ntitle{text-align:center;font-size:32px;font-weight:900;letter-spacing:2px;min-height:44px;line-height:44px}
.ntitle.sm{font-size:21px;letter-spacing:1px}

.stats{display:flex;gap:14px;align-items:baseline;margin:4px 0 2px;flex-wrap:wrap}
.who{font-size:15px;font-weight:900;background:#111;color:#fff;padding:3px 12px;border-radius:999px}
.pow{font-size:14px;font-weight:800;color:#777}

/* HUD */
.hud{margin:8px 0 0}
.hud1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hud1 .yr{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.hud1 .yr em{font-style:normal;font-size:12px;font-weight:800;color:#aaa;margin-left:3px}
.hud1 .lv{font-size:15px;font-weight:900;background:#111;color:#fff;padding:3px 11px;border-radius:999px}
.hud1 .age{font-size:12.5px;font-weight:800;color:#8a8a96}
.hud1 .rings{display:flex;gap:4px;align-items:center}
.hud1 .rg{display:inline-block;width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(0,0,0,.2)}
.hud2{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;min-height:20px}
.tag{font-size:11.5px;font-weight:800;background:#f2f2f5;border:1.5px solid #e3e3e9;color:#555;padding:2px 9px;border-radius:999px}
.tag.gold{background:#fdf6e3;border-color:#e6cf8a;color:#9a7b1a}
.tag.hot{background:#111;border-color:#111;color:#fff}

.poolwrap{text-align:center;margin-top:9px}
.poolname{display:inline-block;font-size:13px;font-weight:900;color:#666;background:#f6f6f8;border:1.5px dashed #dcdce2;border-radius:999px;padding:5px 15px;letter-spacing:.5px}

/* 转盘 */
.wheelwrap{position:relative;width:100%;max-width:540px;margin:10px auto 0;aspect-ratio:1/1}
.wheelwrap canvas{width:100%;height:100%;display:block}
.hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:20%;height:20%;border-radius:50%;background:#fff;border:none;padding:0;
  box-shadow:0 0 0 6px rgba(255,255,255,.92),0 4px 18px rgba(0,0,0,.16);
  display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .12s;
}
.hub:hover{transform:translate(-50%,-50%) scale(1.06)}
.hub:active{transform:translate(-50%,-50%) scale(.96)}
.hub.gone{pointer-events:none;opacity:.3}
.hub svg{width:46%;height:46%;margin-left:8%}

/* 结果 */
.res{margin:16px 0 0;padding:14px 16px;border-radius:14px;background:#f6f6f8;border-left:6px solid #111;font-size:15.5px;line-height:1.85;font-weight:700;display:none}
.res.on{display:block}
.res .k{font-size:13px;font-weight:900;color:#888;display:block;margin-bottom:3px;letter-spacing:1px}
.res .deltas{margin-top:9px;display:flex;gap:9px;flex-wrap:wrap;font-size:13px}
.res .deltas b{padding:2px 9px;border-radius:999px;background:#fff;border:1.5px solid #e3e3e9}
.res .deltas b.up{background:#eef7ef;border-color:#bfe0c5;color:#2c7a3d}
.res .deltas b.down{background:#fdeeee;border-color:#eec2c2;color:#b3302c}
.res .deltas b.ring{background:#f6f2fd;border-color:#d8c8f5;color:#6b3fbb}
.res .deltas b.time{background:#fff8e8;border-color:#eeddb0;color:#8a6a10}

/* 按钮 */
.under{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.btn{border:2.5px solid #111;background:#fff;color:#111;font-family:inherit;font-size:16px;font-weight:900;letter-spacing:2px;padding:11px 30px;border-radius:999px;cursor:pointer;transition:.12s}
.btn:hover{background:#111;color:#fff}
.btn.solid{background:#111;color:#fff}
.btn.solid:hover{background:#333;border-color:#333}

/* 剧情簿 */
.log{margin-top:22px;border-top:2px solid #eee;padding-top:12px;max-height:230px;overflow-y:auto}
.log .r{font-size:14px;line-height:1.75;padding:5px 0;color:#444;display:flex;gap:9px}
.log .r b{font-weight:900;color:#111;flex-shrink:0}
.log .r .t{color:#aaa;font-weight:800;flex-shrink:0;min-width:52px}
.log .r.god b{color:#b8860b}
.log .r.dead b{color:#c0392b}
.hint{text-align:center;color:#bbb;font-size:13px;margin-top:14px;line-height:1.8}

/* 结局 */
.end{text-align:center;padding:26px 8px}
.end .big{font-size:40px;font-weight:900;letter-spacing:4px;margin-bottom:10px}
.end .big.good{color:#b8860b}
.end .big.bad{color:#c0392b}
.end .sub{font-size:16px;font-weight:800;color:#777;margin-bottom:20px}
.end .body{font-size:15.5px;line-height:2;text-align:left;background:#f6f6f8;border-radius:14px;padding:18px}
.end .body li{margin-left:20px}
</style>
</head>
<body>
<div class="page">
  <div class="ntitle" id="ntitle">？？？</div>
  <div class="stats">
    <span class="who" id="who">不知身在何处</span>
    <span class="pow" id="pow"></span>
  </div>
  <div class="hud" id="hud"></div>
  <div class="poolwrap" id="poolwrap"></div>

  <div class="wheelwrap" id="wrap">
    <canvas id="cv"></canvas>
    <button class="hub" id="hub"><svg viewBox="0 0 100 100"><path d="M28 14 L86 50 L28 86 Z" fill="#111"/></svg></button>
  </div>

  <div class="res" id="res"></div>
  <div class="under" id="under"></div>
  <div class="log" id="log"></div>
  <div class="hint" id="hint">点中间的 ▶ 转一次</div>
</div>

<script>
/* =========================================================
   一、引 擎
   ========================================================= */
const $ = id => document.getElementById(id);
const PALETTE = ['#E24B45','#E8823A','#E0B33A','#45A85B','#2FA79F','#4A72DB','#9A50D2','#E0518F'];

/* 等级称号 */
const TITLES = [[91,'封号斗罗'],[81,'魂斗罗'],[71,'魂圣'],[61,'魂帝'],[51,'魂王'],[41,'魂宗'],[31,'魂尊'],[21,'大魂师'],[11,'魂师'],[1,'魂士']];
const BEAST_T = [[91,'百万年魂兽'],[71,'十万年魂兽'],[51,'万年魂兽'],[31,'千年魂兽'],[11,'百年魂兽'],[1,'十年魂兽']];
const titleOf = lv => {
  const b = S && S.beast;
  /* 魂兽没有"等级" —— 它的层次看【修为】,不看年龄 */
  if (b){
    const x = S.xiu || 0;
    if (x >= 1000000) return '百万年魂兽';
    if (x >= 100000)  return '十万年魂兽';
    if (x >= 10000)   return '万年魂兽';
    if (x >= 1000)    return '千年魂兽';
    if (x >= 100)     return '百年魂兽';
    return '十年魂兽';
  }
  for (const [n, s] of TITLES) if (lv >= n) return s;
  return '魂士';
};

/* 魂兽:每过一年能涨多少【修为年数】。修为越高,长得越快(所以修为会跑在年龄前面)。
   例:十年档每过 1 年涨 1 点修为系数 —— 过 10 年就是 +100 修为,直接够到百年。 */
function xiuMult(x){
  if (x < 100)     return 1;
  if (x < 1000)    return 2;
  if (x < 10000)   return 3;
  if (x < 100000)  return 4;
  if (x < 1000000) return 5;
  return 6;
}

/* 一次最多涨"半个档位" —— 免得一个奇遇从百年直接跳到千年 */
function xiuCap(x){
  return Math.pow(10, Math.floor(Math.log10(Math.max(10, x))) + 1) / 2;
}
/* 魂环颜色:白 / 黄 / 紫 / 黑 / 红 */
const RINGC = {'十年':'#fafafa','百年':'#E0B33A','千年':'#9A50D2','万年':'#2b2b2b','十万年':'#E24B45'};

let S = {}, cur = null, segs = [], rot = 0, winner = -1, spinning = false, over = false;
let snap = null, canRespin = false, rerollLeft = 0;

/* ---------- 数字 ---------- */
function fmtY(y){
  if (y >= 1e8) return (y/1e8).toFixed(2).replace(/\.?0+$/,'') + '亿';
  if (y >= 1e4) return (y/1e4).toFixed(y % 1e4 ? 1 : 0).replace(/\.?0+$/,'') + '万';
  return String(Math.round(y));
}
const isHot = t => /龙|冰帝|法则|领域|神|双生|昊天|蓝银|异种|雪原之子|飞升|魂骨|魂灵|传承/.test(t);

/* ---------- HUD ---------- */
function renderHUD(){
  const h = $('hud'); if (!h) return;
  let rings = '';
  for (let k = 0; k < 9; k++){
    const r = S.rings[k];
    rings += '<i class="rg" style="background:' + (r ? (RINGC[r.y] || '#888') : '#e8e8ee') + '" title="' + (r ? r.y + '魂环' : '空') + '"></i>';
  }
  const tags = [];
  if (S.sex) tags.push('<span class="tag sex">' + S.sex + '</span>');
  if (S.bones) tags.push('<span class="tag gold">' + (S.beast ? '兽骨' : '魂骨') + ' ×' + S.bones + '</span>');
  if (S.spirits.length) tags.push('<span class="tag hot">魂灵 · ' + S.spirits.join('、') + '</span>');
  S.tags.filter(t => t !== S.sex).slice(-5).forEach(t => tags.push('<span class="tag' + (isHot(t) ? ' gold' : '') + '">' + t + '</span>'));

  h.innerHTML =
      '<div class="hud1">'
    +   (S.beast
          ? '<span class="yr">' + fmtY(S.xiu || 10) + '<em>年修为</em></span>'
            + '<span class="lv">' + titleOf(0) + '</span>'
            + '<span class="age">活了 ' + fmtY(S.year) + ' 岁</span>'
          : '<span class="yr">' + S.year + '<em>岁</em></span>'
            + '<span class="lv">' + S.lv + ' 级 · ' + titleOf(S.lv) + '</span>'
            + '<span class="rings">' + rings + '</span>')
    + '</div>'
    + '<div class="hud2">' + tags.join('') + '</div>';
}

/* ---------- 画盘 ---------- */
/* 性别盘:人线是"男/女",兽线是"雄/雌" —— 魂兽不用男女的说法 */
function sexSegs(beast){
  return beast ? [
    {w:44, t:'雄', r:'一头公兽。', to:'ORIGIN', set:{sex:'雄', tags:['雄']}},
    {w:44, t:'雌', r:'一头母兽。', to:'ORIGIN', set:{sex:'雌', tags:['雌']}},
    {w:7,  lb:'雌雄同体', t:'双性 —— 雌雄同体', r:'两套都在你身上。兽群里也不常见。', to:'ORIGIN', set:{sex:'双性', tags:['双性']}},
    {w:5,  lb:'无性', t:'无性 —— 不分雌雄', r:'你既不是公的也不是母的。同类见了你会绕开。', to:'ORIGIN', set:{sex:'无性', tags:['无性']}}
  ] : null;
}
/* req:'某标签' 的格子只有身上有该标签时才出现(性别/化形等专属剧情) */
function pickSegs(id, n){
  let L = n.segs;
  if (id === 'RING') L = ringSegs(S.lv);
  else if (id === 'BMILE') L = bmileSegs(S.xiu || 10);
  else if (id === 'sex'){ const b = sexSegs(S.beast); if (b) L = b; }
  const ok = t => !t || S.tags.indexOf(t) >= 0;
  const f = L.filter(s => ok(s.req));
  return f.length ? f : L;
}

function paint(seg){
  segs = seg.map((s, i) => ({ ...s, c: s.c || PALETTE[i % PALETTE.length], w: s.w || 1 }));
  const tot = segs.reduce((a, s) => a + s.w, 0);
  let acc = 0;
  segs.forEach(s => { s.from = acc / tot * 360; acc += s.w; s.deg = s.w / tot * 360; });
}

function drawDial(cv, list, rotDeg, win){
  const ctx = cv.getContext('2d');
  const W = cv.width, R = W/2, cx = R, cy = R;
  /* 高清屏:画布实际像素是 CSS 尺寸的 dpr 倍,所有"绝对像素"都要乘 dpr,否则手机上会被放大变糊 */
  const dpr = cv._dpr || 1;
  ctx.clearRect(0, 0, W, W);
  const baseFs = W * (list.length > 5 ? 0.036 : 0.041);

  list.forEach((s, i) => {
    const a0 = (rotDeg + s.from - 90) * Math.PI/180;
    const a1 = (rotDeg + s.from + s.deg - 90) * Math.PI/180;
    const mid = (a0 + a1) / 2;

    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R-3*dpr, a0, a1); ctx.closePath();
    ctx.fillStyle = s.c; ctx.fill();
    if (win === i){ ctx.lineWidth = 7*dpr; ctx.strokeStyle = '#111'; ctx.stroke(); }
    else { ctx.lineWidth = 2.5*dpr; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.stroke(); }

    const inner = R*0.30, outer = R*0.955, span = outer - inner;
    const arcW = 2 * (R*0.63) * Math.sin(Math.min(Math.PI*0.5, (s.deg*Math.PI/180)/2));
    if (arcW < 21*dpr) return;   /* 细缝只留颜色 */

    let text = s.t, f = baseFs;
    for (let k = 0; k < 16; k++){
      const p = Math.max(3, Math.floor(span / (f*1.02)));
      const need = Math.ceil(Array.from(text).length / p);
      if (need * f * 1.22 <= arcW || f <= W*0.019) break;
      f *= 0.88;
    }
    if (s.lb && f <= W*0.027) text = s.lb;
    const fs = Math.max(9*dpr, Math.round(f));
    const per = Math.max(3, Math.floor(span / (fs * 1.02)));
    const chars = Array.from(text);
    const lines = [];
    for (let k = 0; k < chars.length; k += per) lines.push(chars.slice(k, k+per).join(''));
    for (let k = 1; k < lines.length; k++){
      while (lines[k].length && ')]),。、;:!?」』'.indexOf(lines[k][0]) >= 0){ lines[k-1] += lines[k][0]; lines[k] = lines[k].slice(1); }
    }
    const L = lines.filter(x => x.length);

    ctx.save();
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R-3*dpr, a0, a1); ctx.closePath(); ctx.clip();

    const flip = Math.cos(mid) < 0;
    const ang = flip ? mid + Math.PI : mid;
    const lh = fs * 1.22;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.font = '900 ' + fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = flip ? 'left' : 'right';
    for (let k = 0; k < 2; k++){
      ctx.fillStyle = k === 0 ? 'rgba(0,0,0,.26)' : '#fff';
      const d = k === 0 ? 1.6*dpr : 0;
      L.forEach((ln, j) => {
        const y = (j - (L.length-1)/2) * lh;
        ctx.save(); ctx.translate(d, d); ctx.rotate(ang);
        ctx.fillText(ln, flip ? -outer : outer, y);
        ctx.restore();
      });
    }
    ctx.restore(); ctx.restore();
  });

  ctx.beginPath(); ctx.arc(cx, cy, W*0.126, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill();
}

function fit(){
  const cv = $('cv');
  if (!cv || !cv.parentElement) return false;
  const w = Math.round(cv.parentElement.clientWidth || 520);
  /* 按屏幕密度放大画布的像素缓冲区 —— 这就是手机上转盘糊的根因 */
  const dpr = Math.min(3, Math.max(1, window.devicePixelRatio || 1));
  cv.width = cv.height = Math.round(w * dpr);
  cv._dpr = dpr;
  return true;
}
function redraw(){ if (fit()) drawDial($('cv'), segs, rot, winner); }

/* ---------- 魂环盘:稀有魂环的概率随等级提升 ---------- */
function ringSegs(lv){
  /* t: 10 级 -> 0(全是白环)   90 级 -> 1(大半是红环) */
  const t = Math.min(1, Math.max(0, (lv - 10) / 80));
  const w = (early, late) => Math.max(1, Math.round(early + (late - early) * t));
  return [
   {w:w(38,1),  t:'十年魂环(白)',     r:'最普通的那种。至少没出岔子。',    ring:'十年',   to:'YEAR', set:{tags:['十年魂环']}},
   {w:w(32,5),  t:'百年魂环(黄)',     r:'标准配置,稳稳当当。',            ring:'百年',   to:'YEAR', set:{tags:['百年魂环']}},
   {w:w(15,15), t:'千年魂环(紫)',     r:'你越级了,而且扛住了。',          ring:'千年', lv:1, to:'YEAR', set:{tags:['千年魂环']}},
   {w:w(6,33),  t:'万年魂环(黑)',     r:'越了整整两档。你吐了三天的血。',  ring:'万年', lv:2, to:'YEAR', set:{tags:['万年魂环']}},
   {w:w(1,38),  lb:'十万年魂环', t:'十万年魂环(红)', r:'那东西认了你。没人敢信。', ring:'十万年', lv:4, to:'YEAR', set:{tags:['十万年魂环']}},
   {w:w(6,7),   t:'吸收失败,魂力倒退', r:'你在床上躺了一年。',             lv:-1, to:'YEAR', set:{tags:['吸收失败过']}},
   {w:w(2,2),   t:'猎到的魂兽年限不够', r:'你只能拿它凑数。',              ring:'十年',   to:'YEAR'},
   {w:Math.round(t*t*4), lb:'魂环里住着东西', t:'你吸收的魂环里,住着一个魂灵', r:'它开口说了话。', ring:'万年', spirit:'环中魂灵', lv:3, to:'YEAR'}
  ].filter(s => s.w > 0);
}

/* ---------- 魂兽的里程碑:每跨过一个"年限刻度"就进阶一次(魂兽不吸魂环) ---------- */
function bmileStep(y){ return Math.pow(10, Math.floor(Math.log10(Math.max(1, y)))); }
function bmileSegs(y){
  /* t: 十年档 -> 0   十万年以上 -> 1   —— 越老越可能摸到血脉/领域/魂骨 */
  const t = Math.min(1, Math.max(0, (Math.log10(Math.max(10, y)) - 1.3) / 3.7));
  const w = (a, b) => Math.max(1, Math.round(a + (b - a) * t));
  const L = [
   {w:w(30,10), t:'你的体魄又壮了一分',   r:'筋骨更硬,咬合更狠。',              lv:1, to:'YEAR'},
   {w:w(26,12), t:'你的皮更厚了',         r:'刀砍上去只留一道白印。',            lv:1, to:'YEAR'},
   {w:w(16,14), t:'你觉醒了本命的东西',   r:'这不是学来的,是生下来就有的。',    lv:2, to:'YEAR', set:{tags:['本命之技']}},
   {w:w(10,16), t:'你身上长出一块兽骨',   r:'它比别处都硬。',                    bone:1, lv:1, to:'YEAR'},
   {w:w(6,18),  t:'你把一头同阶的吞了',   r:'它的年限全归了你。',                lv:3, to:'YEAR', set:{tags:['吞过同阶']}},
   {w:w(5,12),  t:'你开了智',             r:'你开始听得懂人话 —— 也听得懂谎话。', lv:2, to:'YEAR', set:{tags:['开过智']}},
   {w:w(2,10),  t:'人类盯上了你的魂环',   r:'他们要的就是这个 —— 虽然你现在这圈还不值钱。', lv:-2, to:'YEAR', set:{tags:['被人盯上']}},
   {w:w(1,4),   t:'你没跨过这道坎',       r:'你倒在了自己的领地上。',            to:'end_dead'}
  ];
  if (y >= 1000) L.push({w:Math.round(4 + 10 * t), lb:'领域', t:'你张开了一片自己的领域', r:'这片地方,从今天起谁进来谁死。', lv:4, to:'YEAR', set:{tags:['有领域']}});
  if (y >= 5000) L.push({w:Math.round(3 + 8 * t), lb:'天劫', t:'天劫在你头上聚了三个月', r:'你扛下来了,也换了一副骨头。', bone:1, lv:5, to:'YEAR', set:{tags:['扛过天劫']}});
  if (y >= 100000 && !S.hxTried) L.push({w:22, lb:'化 形', t:'你要不要化形成人', r:'这一步踏出去,就回不来了。', to:'huaxing'});
  return L.filter(s => s.w > 0);
}

/* ---------- 年度盘的分段:按年龄/年限/等级切换 ---------- */
function yearWheel(){
  const y = S.year;
  if (S.beast){
    const x = S.xiu || 10;   /* 魂兽按【修为】分档,不按年龄 */
    if (x < 100) return 'by_1';
    if (x < 1000) return 'by_2';
    if (x < 10000) return 'by_3';
    if (x < 100000) return 'by_4';
    if (x < 1000000) return 'by_5';
    return 'by_6';
  }
  /* 99 级满级之后:整个转盘都围绕神位 */
  if (S.hx && S.year <= 40) return 'y_hx';   /* 刚化形的那些年,走"化形者"专属盘 */
  if (S.lv >= 99) return 'y_god';
  if (y <= 12) return 'y_child';
  if (y <= 18) return 'y_teen';
  if (y <= 30) return 'y_young';
  if (y <= 50) return 'y_prime';
  if (y <= 70) return 'y_mid';
  return 'y_old';
}

/* ---------- 过一年 ---------- */
/* 开局那几转不算时间(你还没出生 / 刚出生) */
const NOTIME = { start:1, sex:1, origin_h:1, origin_b:1,
  h_fish:1, h_smith:1, h_hall:1, h_sect:1, h_hunter:1, h_genius:1, h_fallen:1,
  b_north:1, b_forest:1, b_deep:1, b_vol:1 };
/* 这些是"插进来的子盘"(机遇/猎杀/魂环/进阶/化形):转进去的那一下不算时间,
   时间由子盘自己的结果算 —— 否则一年里连开三个子盘,年龄就白涨三岁 */
const SUBWHEEL = { oppA:1, oppB:1, oppC:1, oppD:1, oppE:1, huntA:1, huntB:1, huntC:1,
  b_oppA:1, b_oppB:1, b_oppC:1, b_hunt:1, RING:1, BMILE:1, huaxing:1 };

function nextYear(){
  if (over) return;
  /* 年岁在"落格"那一下就已经走过了(见 land),这里不再加 —— 只负责往前推一格 */
  S.jump = 0; S.skip = 1;
  /* 寿限:魂师随等级走;魂兽随修为走(涨得比年龄快,所以能活很久) */
  /* 魂兽的寿限给得很宽 —— 修为按比例涨,年龄永远追不上;
     魂兽的"老死"交给正文里的"寿元到了"那一格,不由公式卡死 */
  S.life = S.beast ? Math.floor(400 + (S.xiu || 10) * 0.09) : (78 + Math.floor(S.lv * 0.9));
  if (S.year > S.life) return showEnd(NODES[S.beast ? 'end_beast_old' : 'end_old']);
  /* 里程碑:魂师每十级吸一个魂环;魂兽不吸魂环,改成每跨一个年限刻度进阶一次 */
  if (S.beast){
    /* 修为进阶盘:每跨一个刻度来一次,但至少隔 3 个"年月盘"再来,免得刷屏 */
    S.sinceMile = (S.sinceMile || 0) + 1;
    const x = S.xiu || 10, from = S.mileAt || 10;
    const st = bmileStep(from), nx = Math.floor(from / st) * st + st;
    if (x >= nx && S.sinceMile >= 3){
      S.mileAt = nx; S.sinceMile = 0;
      return goTo('BMILE');
    }
    S.mileAt = x;
  } else if (S.rings.length < 9 && S.lv >= (S.rings.length + 1) * 10 && S.lastRingAt !== S.lv){
    S.lastRingAt = S.lv;
    return goTo('RING');
  }
  goTo(yearWheel());
}

/* ---------- 去一个节点 ---------- */
function goTo(id){
  if (over) return;
  if (id === 'YEAR') return nextYear();
  if (id === 'ORIGIN') return goTo(S.beast ? 'origin_b' : 'origin_h');
  const n = NODES[id];
  if (!n){ console.error('没有这个节点:', id); return; }
  if (n.end) return showEnd(n);

  cur = id; winner = -1; spinning = false; rot = 0;
  snap = null; canRespin = false; rerollLeft = 3;
  paint(pickSegs(id, n));
  if (typeof n.y0 === 'number' && n.y0 > S.year) S.year = n.y0;

  /* 魂兽的年月盘:标题跟着【修为】走,不要写死成"百年魂兽" */
  let dynTitle = /^by_/.test(id) ? (titleOf(0) + ' · 又 过 了 些 年') : n.title;
  if (id === 'sex' && S.beast) dynTitle = '雌 还 是 雄';
  $('ntitle').textContent = dynTitle;
  $('ntitle').className = 'ntitle' + (n.title.replace(/\s/g,'').length > 8 ? ' sm' : '');
  $('who').textContent = S.who || n.who || '';
  $('pow').textContent = n.pow || S.pow || '';
  $('res').className = 'res';
  $('under').innerHTML = '';
  let kind = n.kind || '';
  if (id === 'RING') kind = '第 ' + (S.rings.length + 1) + ' 个魂环 · ' + S.lv + ' 级';
  if (id === 'BMILE') kind = '修 为 ' + (S.xiu >= 10000 ? (S.xiu / 10000) + ' 万 年' : Math.floor(S.xiu || 10) + ' 年') + ' · 进 阶';
  if (/^by_/.test(id)) kind = '修 为 ' + fmtY(S.xiu || 10) + ' 年 · 每 转 一 次 就 是 一 段 年 月';
  if (id === 'y_god') kind = '99 级 · 满 级 之 后';
  $('poolwrap').innerHTML = kind ? '<div><span class="poolname">' + kind + '</span></div>' : '';
  $('hint').innerHTML = n.text ? n.text : '点中间的 ▶ 转一次';
  if (id === 'sex' && S.beast) $('hint').innerHTML = '第二转:性别。<br>兽群里说的是<b>雌</b>和<b>雄</b> —— 另外两种更罕见。';
  $('hub').classList.remove('gone');
  renderHUD();
  redraw();
  window.scrollTo(0, 0);
}

/* ---------- 转 ---------- */
function spin(canAgain){
  if (spinning || over || winner >= 0) return;
  canRespin = !!canAgain;
  snap = canRespin
    ? { year:S.year, lv:S.lv, rings:S.rings.slice(), bones:S.bones, spirits:S.spirits.slice(),
        tags:S.tags.slice(), who:S.who, pow:S.pow, steps:S.steps.length, life:S.life,
        logLen:$('log').children.length, lastRingAt:S.lastRingAt, godAt:S.godAt, beast:S.beast,
        sex:S.sex, mileAt:S.mileAt, hx:S.hx, hxTried:S.hxTried, hxDone:S.hxDone, sinceMile:S.sinceMile, xiu:S.xiu, jump:S.jump, adv:S.adv }
    : null;
  spinning = true;
  $('hub').classList.add('gone');
  $('hint').textContent = '转盘在转……';

  const tot = segs.reduce((a, s) => a + s.w, 0);
  let roll = Math.random() * tot, idx = segs.length - 1;
  for (let i = 0; i < segs.length; i++){ roll -= segs[i].w; if (roll <= 0){ idx = i; break; } }

  const want = -(segs[idx].from + segs[idx].deg / 2);
  const c = ((rot % 360) + 360) % 360;
  const turns = 5 + Math.floor(Math.random()*3);
  const from = rot;
  const to = rot + ((want - c + 360) % 360) + 360 * turns;

  const cv = $('cv'), t0 = performance.now();
  const dur = cur === 'RING' ? 2600 : 2100;
  const ease = t => 1 - Math.pow(1 - t, 3.4);
  (function f(now){
    if (over) return;
    const t = Math.min(1, (now - t0) / dur);
    rot = from + (to - from) * ease(t);
    drawDial(cv, segs, rot, -1);
    if (t < 1) requestAnimationFrame(f);
    else { rot = to; land(idx); }
  })(t0);
}

/* ---------- 落格 ---------- */
function land(idx){
  const s = segs[idx], node = NODES[cur];
  winner = idx; spinning = false;
  drawDial($('cv'), segs, rot, idx);

  /* 条件重抽 */
  if (s.savedBy && S.tags.indexOf(s.savedBy) >= 0 && rerollLeft > 0){
    rerollLeft--;
    $('res').className = 'res on';
    $('res').innerHTML = '<span class="k">重 抽</span>你身上有「' + s.savedBy + '」—— 这一格作废,再抽一次。';
    $('under').innerHTML = '<button class="btn solid" id="rr">重 抽 ↻</button>';
    $('rr').onclick = () => { winner = -1; $('res').className = 'res'; $('under').innerHTML = ''; $('hub').classList.remove('gone'); spin(false); };
    $('hint').textContent = '「' + s.savedBy + '」保了你一次';
    return;
  }

  const before = { lv:S.lv, bones:S.bones, rings:S.rings.length, spirits:S.spirits.length, xiu:S.xiu || 0 };
  const wasBeast = !!S.beast;

  if (s.set){
    if (s.set.beast !== undefined) S.beast = !!s.set.beast;
    if (s.set.sex) S.sex = s.set.sex;
    if (s.set.hx !== undefined) S.hx = !!s.set.hx;
    if (s.set.xiu !== undefined) S.xiu = s.set.xiu;
    if (s.set.who) S.who = s.set.who;
    if (s.set.pow) S.pow = s.set.pow;
    (s.set.tags || []).forEach(t => { if (S.tags.indexOf(t) < 0) S.tags.push(t); });
  }
  if (s.lv)  S.lv = Math.max(1, Math.min(99, S.lv + s.lv));
  if (s.ring){ S.rings.push({ y:s.ring }); }
  if (s.bone){ S.bones = Math.min(6, S.bones + s.bone); }
  if (s.spirit && S.spirits.indexOf(s.spirit) < 0){ S.spirits.push(s.spirit); }
  S.skip = s.skip || 1;
  if (typeof s.sy === 'number'){ S.year = s.sy; S.jump = 0; }
  if (cur === 'huaxing') S.hxTried = 1;
  /* 化形成人:性别说法跟着从"雌/雄"换成"男/女" */
  if (wasBeast && !S.beast && (S.sex === '雄' || S.sex === '雌')){
    const nw = S.sex === '雄' ? '男' : '女';
    S.tags = S.tags.map(t => t === S.sex ? nw : t);
    S.sex = nw;
  }
  /* 魂兽:段落的 skip 当【修为增长年数】,年龄只涨它的 1/10 —— 所以修为跑在年龄前面 */
  if (wasBeast && S.beast){
    if (!S.xiu) S.xiu = 10;
    const m = xiuMult(S.xiu);
    const want = (s.skip || 1) * m * (1 + (s.lv || 0) / 10);
    const g = Math.round(Math.min(want, xiuCap(S.xiu)));
    S.xiu += g;
    /* 年龄跟修为按同一个比例走:过 1 年 ≈ 涨 (10×系数) 年修为 */
    S.adv = Math.max(1, Math.round(g / (10 * m)));
  } else {
    S.adv = S.skip;
  }
  /* 这一转本身就代表这些年过去了 —— 当场就走,不拖到下一次"过一年"。
     开局那几个盘不算时间;进子盘的那一下也不算(时间由子盘自己的结果算)。
     字幕的时间标签只在"时间真的走了"时才显示,这样两边永远是同一个数。 */
  const timeRuns = !NOTIME[cur];
  if (timeRuns) S.year += S.adv;

  S.steps.push({ t:node.title.replace(/\s/g,''), e:s.t, y:S.year, lv:S.lv });
  $('who').textContent = S.who || '';
  $('pow').textContent = S.pow || '';
  renderHUD();

  /* 变化标签 */
  const d = [];
  if (wasBeast && S.beast){
    const dx = Math.round((S.xiu || 0) - before.xiu);
    if (dx) d.push('<b class="' + (dx > 0 ? 'up' : 'down') + '">修为 ' + (dx > 0 ? '+' : '') + dx + ' 年</b>');
  } else if (S.lv !== before.lv){
    d.push('<b class="' + (S.lv > before.lv ? 'up' : 'down') + '">等级 ' + (S.lv > before.lv ? '+' : '') + (S.lv - before.lv) + ' → ' + S.lv + '</b>');
  }
  if (S.rings.length > before.rings) d.push('<b class="ring">获得 ' + s.ring + '魂环</b>');
  if (S.bones > before.bones) d.push('<b class="up">' + (S.beast ? '兽骨' : '魂骨') + ' +' + (S.bones - before.bones) + '</b>');
  if (S.spirits.length > before.spirits) d.push('<b class="up">魂灵 · ' + s.spirit + '</b>');
  /* 用"这一段实际推进的年岁"(S.adv),不要用段落里写的原值 ——
     魂兽那两个数不一样(段落年数是修为基数,年龄只走它的 1/(10×系数)) */
  if (timeRuns){
    if (wasBeast && S.beast){
      if (S.adv > 1) d.push('<b class="time">年龄 +' + S.adv + ' 岁</b>');
    } else if (S.adv > 1){
      d.push('<b class="time">时间跳了 ' + S.adv + ' 年</b>');
    }
  }

  $('res').className = 'res on';
  $('res').innerHTML = '<span class="k">转 到 了</span>' + s.t + '<br>' + s.r
    + (d.length ? '<div class="deltas">' + d.join('') + '</div>' : '');
  logAdd(node.title, s.t, s.r, s.to, S.year, S.lv);

  /* 按钮 */
  const rs = canRespin ? '<button class="btn" id="rs">↺ 重 转 这 一 格</button>' : '';
  const dest = s.to || 'YEAR';
  if (dest === 'YEAR'){
    $('under').innerHTML = '<button class="btn solid" id="nx">过 一 年 ▸</button>' + rs;
    $('hint').textContent = '过完这一年,又是新的一年';
  } else if (dest === 'YEAR2'){
    $('under').innerHTML = '<button class="btn solid" id="nx">再 过 一 年 ▸</button>' + rs;
  } else {
    $('under').innerHTML = '<button class="btn solid" id="nx">继 续 ▸</button>' + rs;
    $('hint').textContent = '这一格的后头,连着一个新的转盘';
  }
  $('nx').onclick = () => goTo(dest === 'YEAR2' ? 'YEAR' : dest);
  if (canRespin) $('rs').onclick = reSpin;
}

/* ---------- 重转 ---------- */
function reSpin(){
  if (spinning || winner < 0 || !snap) return;
  S.year = snap.year; S.lv = snap.lv; S.rings = snap.rings.slice();
  S.bones = snap.bones; S.spirits = snap.spirits.slice(); S.tags = snap.tags.slice();
  S.who = snap.who; S.pow = snap.pow; S.life = snap.life; S.lastRingAt = snap.lastRingAt;
  S.godAt = snap.godAt; S.beast = snap.beast;
  S.sex = snap.sex; S.mileAt = snap.mileAt; S.hx = snap.hx;
  S.hxTried = snap.hxTried; S.hxDone = snap.hxDone; S.sinceMile = snap.sinceMile;
  S.jump = snap.jump; S.adv = snap.adv;
  S.xiu = snap.xiu;
  S.steps.length = snap.steps;
  while ($('log').children.length > snap.logLen) $('log').lastChild.remove();
  winner = -1; snap = null;
  $('res').className = 'res'; $('under').innerHTML = '';
  $('hub').classList.remove('gone');
  renderHUD();
  spin(false);
}

/* ---------- 剧情簿 ---------- */
function logAdd(nodeTitle, t, r, to, year, lv){
  const d = document.createElement('div');
  const isEnd = NODES[to] && NODES[to].end;
  d.className = 'r' + (isEnd ? (NODES[to].kind === 'good' ? ' god' : ' dead') : '');
  const tm = S.beast ? fmtY(S.xiu || 10) + '年修为' : year + '岁';
  d.innerHTML = '<span class="t">' + tm + '</span><b>' + t + '</b><span>' + r + '</span>';
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}

/* ---------- 结局 ---------- */
function showEnd(n){
  over = true;
  const path = S.steps.map(x => '<li>' + (S.beast ? fmtY(x.y) + '年' : x.y + '岁') + ' · ' + x.e + '</li>').join('');
  const tags = S.tags.map(t => '<span class="tag' + (isHot(t) ? ' gold' : '') + '">' + t + '</span>').join(' ');
  const stat = '<div class="hud2" style="justify-content:center;margin-bottom:16px">'
             + '<span class="tag hot">' + S.lv + ' 级 · ' + titleOf(S.lv) + '</span>'
             + '<span class="tag">魂环 ×' + S.rings.length + '</span>'
             + (S.bones ? '<span class="tag gold">魂骨 ×' + S.bones + '</span>' : '')
             + (S.spirits.length ? '<span class="tag hot">魂灵 · ' + S.spirits.join('、') + '</span>' : '')
             + tags + '</div>';
  document.querySelector('.page').innerHTML =
      '<div class="end">'
    +   '<div class="big ' + n.kind + '">' + n.title + '</div>'
    +   '<div class="sub">' + n.sub + '</div>'
    +   stat
    +   '<div class="body">' + n.body.replace('{path}', '<ul>' + path + '</ul>') + '</div>'
    +   '<div class="under"><button class="btn" onclick="location.reload()">重 开 一 生</button></div>'
    + '</div>';
  window.scrollTo(0, 0);
}
